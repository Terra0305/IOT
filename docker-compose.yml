version: '3.8'

services:
  front:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: weather-front
    ports:
      - '80:80'
    restart: always
    networks:
      - weather-network
    depends_on:
      - api

  api:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: weather-api
    # 포트 8000은 외부로 노출하지 않고 내부 네트워크에서만 접근 (Nginx Proxy)
    # ports:
    #   - '8000:8000' 
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - weather-network

  db:
    image: postgres:15-alpine
    container_name: weather-db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - weather-network
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


networks:
  weather-network:
    driver: bridge
